# ======================================================
# BASE DE DATOS - POSTGRESQL
# ======================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database=postgresql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# ======================================================
# POOL
# ======================================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# ======================================================
# SERVIDOR
# ======================================================

server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# ======================================================
# TWILIO - SMS
# ======================================================

# Defaults allow IntelliJ Play runs without manual env vars.
# Env vars still override these values when present.
twilio.account.sid=${TWILIO_ACCOUNT_SID:AC7a1c7897c69f7240b76d2fc9e2e4d367}
twilio.auth.token=${TWILIO_AUTH_TOKEN:9f8e7a9c098c8adc1717b602d9f66f3a}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+18316039663}

# ======================================================
# ALERTAS - AUTO CIERRE (PRUEBAS)
# ======================================================

# Tiempo de inactividad para cierre automatico.
# En local queda en 30 segundos para pruebas.
alert.auto-close-seconds=${ALERT_AUTO_CLOSE_SECONDS:30}

# Frecuencia del scheduler que revisa alertas vencidas (ms)
alert.auto-close-check-ms=${ALERT_AUTO_CLOSE_CHECK_MS:5000}

# ======================================================
# LOGS DIAGNOSTICO /w/library
# ======================================================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n
logging.level.com.ogs.wprotect.web.config.DeviceIdInterceptor=DEBUG
logging.level.com.ogs.wprotect.web.security.RequireAdminAspect=DEBUG
logging.level.com.ogs.wprotect.web.controller.WlibraryController=DEBUG