# ======================================================
# CONFIGURACIÓN DEL POOL DE CONEXIONES (HikariCP)
# ======================================================
# Tamaño máximo del pool (ajústalo según tu plan de DigitalOcean)
spring.datasource.hikari.maximum-pool-size=5
# Mínimo de conexiones inactivas mantenidas
spring.datasource.hikari.minimum-idle=2
# Tiempo máximo que una conexión puede estar inactiva antes de cerrarse (30s)
spring.datasource.hikari.idle-timeout=30000
# Tiempo máximo que una conexión puede durar viva (10 min)
spring.datasource.hikari.max-lifetime=600000
# Tiempo máximo de espera para obtener una conexión (20s)
spring.datasource.hikari.connection-timeout=20000
# Nombre del pool (opcional, útil para debugging)
spring.datasource.hikari.pool-name=WProtectHikariPool

# ======================================================
# SERVIDOR
