info:
  name: patch user
  type: http
  seq: 3

http:
  method: PATCH
  url: http://localhost:8080/w/users/1
  headers:
    - name: X-User-Id
      value: "1"
    - name: X-Device-Id
      value: "device-id-del-usuario"
  body:
    type: json
    data: |-
      {
        "name": "Nuevo Nombre",
        "email": "nuevo@email.com",
        "phone": "+573001234567"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
